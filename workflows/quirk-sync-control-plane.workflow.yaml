api_version: quirk.dev/workflow/v1alpha1
kind: Workflow
metadata:
  id: workflow.quirk-sync-control-plane
  version: 0.1.0
  status: candidate
trigger:
  allowed:
    - manual
    - admitted_proposed_move
  scheduled: false
actor_ref: agent.quirk-sync-steward
authority_ceiling: propose
inputs:
  - object_key
  - purpose
  - requested_platforms
  - authority_ref
  - source_refs
steps:
  - id: resolve_authority
    skill: skill.quirk-source-authority-resolver
    on_conflict: block_and_propose
  - id: discover_bindings
    action: inventory_platform_state
  - id: fingerprint
    action: normalize_and_hash
  - id: validate_contracts
    skill: skill.quirk-object-contract-engineer
    on_failure: quarantine
  - id: plan_refinement
    skill: skill.quirk-data-refinery
    mode: dry_run
  - id: persist_runtime
    action: upsert_private_binding_and_cursor
    idempotency_required: true
  - id: enqueue_projection
    action: write_projection_outbox
    max_attempts: 5
  - id: rebuild_human_projections
    destinations:
      - google_drive
      - airtable
      - notion
    vercel: inventory_only
  - id: verify
    action: read_back_and_compare
    on_drift: block_and_propose
  - id: emit_receipt
    skill: skill.quirk-evidence-instrumenter
  - id: propose_next_moves
    skill: skill.quirk-roadmap-board-orchestrator
controls:
  default_failure_posture: fail_closed
  maximum_batch_size: 500
  retry:
    max_attempts: 5
    exponential_backoff: true
    dead_letter: true
  protected_actions_require_human: true
outputs:
  - run_receipt
  - binding_changes
  - projection_results
  - drift_findings
  - proposed_moves
acceptance:
  fixtures_ref: evals/sync-control-plane/fixtures.json
  active_only_after_human_admission: true
