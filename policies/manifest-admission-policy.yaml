api_version: quirk.dev/policy/v1alpha1
kind: Policy
metadata:
  id: policy.manifest-admission
  version: 0.4.0
  status: candidate
invariant: capability_never_implies_authority
rules:
  # Checked on both surfaces because neither may assume JSON Schema ran first.
  # The SQL trigger had no requester check at all, so 'NOT-A-PRINCIPAL'
  # activated a manifest.
  - id: well_formed_requester
    require: admission.requested_by matches "^(human|agent|service|system)\\.[a-z0-9._-]+$"
  - id: no_self_approval
    require: admission.requested_by != admission.approved_by
  # A manifest may request its own activation; it may never approve one.
  # agent. is refused because capability never implies authority. service. and
  # system. are refused until an allow-list of authorized service approvers
  # exists. Replaces the former metadata.self_requested rule, which the judged
  # document set for itself.
  #
  # The whole principal is matched, not its prefix, so a bare "human." naming
  # nobody is refused here exactly as it is in both enforcement surfaces.
  #
  # This rule constrains WHICH principal may appear, not whether that principal
  # really approved. approved_by is still a string the judged manifest supplies,
  # so a fabricated human.* value satisfies it. Establishing authenticity needs
  # an attestation the manifest cannot author; see
  # docs/briefs/2026-10-03-approval-attestation.md.
  - id: independent_human_approval
    require: admission.approved_by matches "^human\\.[a-z0-9._-]+$"
  - id: evaluated_hash_matches
    require: admission.evaluated_content_hash == content_hash
  - id: explicit_grant
    require: admission.authority_grant_ref
  - id: legal_transition
    require: admission.transition_ref
  - id: active_requires_evidence
    require: eval_refs and stop_conditions and admission.evidence_refs
  - id: rights_before_productization
    when: domains contains data_productization
    require: rights_review.outcome == approved and rights_review.license_verified and rights_review.privacy_review == approved and rights_review.provenance_complete
  - id: collisions_fail_closed
    when: manifest_kind == orchestrator and len(skill_refs) > 1
    require: trigger_contract.collision_behavior == block
protected_actions:
  - activate_manifest
  - promote_canon
  - expand_authority
  - merge_pull_request
  - deploy_production

verification_contract:
  hash_profile: runtime-manifest-content.v1
  attestation_schema: manifest-approval-attestation.v1
  approval_root: exact_head_scoped_human_github_review
  ownership_source: protected_base_branch_CODEOWNERS_and_installed_account_ID_mapping
  database_independence: projection
  database_write_role: quirk_manifest_verifier
  bootstrap: blocked_until_host_policy_and_repository_protection_are_admitted
  requirements:
    - compute_content_hash_including_all_metadata
    - resolve_review_identity_scope_expiry_revocation_and_evaluation_materials
    - compare_entire_admission_envelope_with_resolved_consent
    - refuse_fabricated_refs_and_ambiguous_or_unavailable_approval
    - reverify_immediately_before_database_transaction
    - preserve_append_only_history_and_zero_effect_replay
  limitations:
    - PostgreSQL_does_not_independently_resolve_GitHub_or_recompute_Python_JSON_hashes
    - privileged_verifier_or_database_administrator_compromise_is_outside_this_boundary
    - review_resolution_and_database_write_are_not_cross_provider_atomic
