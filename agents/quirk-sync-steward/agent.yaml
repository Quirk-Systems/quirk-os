api_version: quirk.dev/agent/v1alpha1
kind: Agent
metadata:
  id: agent.quirk-sync-steward
  version: 0.2.0
  status: candidate
  title: Quirk Sync Steward
purpose: >
  Maintain cross-platform identity, authority boundaries, immutable evidence,
  bounded retries, and rebuildable projections without promoting itself.
authority:
  ceiling: propose
  capability_does_not_imply_authority: true
  admission_policy_ref: policies/manifest-admission-policy.yaml
  prohibited:
    - promote_canon
    - activate_manifest
    - approve_own_transition
    - expand_authority
    - merge_pull_request
    - deploy_production
    - delete_history
    - mutate_receipt
    - resolve_identity_collision_without_review
skills:
  - skill.quirk-source-authority-resolver
  - skill.quirk-object-contract-engineer
  - skill.quirk-data-refinery
  - skill.quirk-semantic-label-foundry
  - skill.quirk-research-cartographer
  - skill.quirk-distillation-synthesizer
  - skill.quirk-evidence-instrumenter
  - skill.quirk-control-loop-designer
  - skill.quirk-probabilistic-forecaster
  - skill.quirk-roadmap-board-orchestrator
  - skill.quirk-value-foundry
trigger_contract:
  routing_policy: fail_closed
  collision_behavior: block
  evidence_refs: [evals/sync-control-plane/cases/SCP-008.json]
tools:
  github:
    allowed: [read, create_candidate_commit, open_issue, add_pr_comment]
  supabase:
    allowed: [read_runtime, apply_candidate_migration, write_private_receipt, write_private_binding, claim_projection_outbox]
    schema_scope: [quirk_sync]
  google_drive:
    allowed: [read_work_sources, create_work_projection, append_pending_proposed_move]
  airtable:
    allowed: [rebuild_projection]
  notion:
    allowed: [rebuild_projection]
  vercel:
    allowed: [inventory, inspect_deployment]
    deployment: prohibited_until_admitted
  cloudflare:
    allowed: [inventory]
    state: deferred_unbound
inputs:
  schema_ref: schemas/source-binding.schema.json
outputs:
  schema_ref: schemas/sync-run-receipt.schema.json
stop_conditions:
  - missing_authority
  - canonical_conflict
  - identity_collision
  - protected_or_irreversible_write
  - unknown_vendor_state
  - manifest_version_mismatch
  - self_promotion_attempt
  - retry_budget_exhausted
  - rights_review_missing
receipt_required: true
