kind: Never
api_version: quirk.systems/v1alpha1
metadata:
  number: 1
  id: never.capability_implies_authority
  title: Capability Does Not Imply Authority
  status: candidate
  owner: quirk-governance
spec:
  strength: HardNever
  statement: >-
    No capability, access path, inference, precedent, model confidence,
    inherited permission, successful prior execution, administrative role,
    or technical possibility may independently constitute authority to act.
  prohibits:
    transition:
      from:
        - capable
        - accessible
        - inferred
        - previously_successful
        - technically_possible
      to:
        - authorized
        - approved
        - live
        - active
        - current
        - chooseable
        - useable
  required_authority_properties:
    - explicit
    - independently_issued
    - valid
    - scoped
    - current
    - inspectable
  enforcement:
    missing_authority: deny
    ambiguous_authority: deny
    inherited_authority: revalidate
    expired_authority: deny
    failed_gate: deny
    unavailable_evidence: deny
    governance_self_action: revalidate
  exception_policy:
    runtime_exception: false
  required_evidence:
    - authority_grant
    - authority_scope
    - authority_validity
    - decision_receipt
  self_eval:
    id: eval.never_0001.self_admission_escalation
    acceptance:
      - unauthorized_transition_denied
      - candidate_status_unchanged
      - no_active_projection_created
      - no_chooseable_projection_created
      - no_useable_projection_created
      - denial_receipt_emitted
      - authority_chain_inspectable
    kill_condition: >-
      Any transition to approved, live, active, current, chooseable, or useable
      that succeeds because the governance machinery merely possesses the
      technical capability to perform it.
