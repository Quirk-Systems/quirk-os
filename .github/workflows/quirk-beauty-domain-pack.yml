name: Quirk Beauty Domain Pack v0.1.1

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/canon/QUIRK-BEAUTY-DOMAIN-BOUNDARY.*"
      - "docs/canon/README.md"
      - "decisions/ADR-0002-quirk-beauty-domain-boundary.md"
      - "domains/beauty/**"
      - "supabase/migrations/20260821090000_quirk_beauty_taste_engine_candidate.sql"
      - "supabase/tests/quirk_beauty_taste_engine_rls.sql"
      - ".github/CODEOWNERS"
      - ".github/workflows/quirk-beauty-domain-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-contract-suite:
    name: Node ${{ matrix.node }} exact-head contract suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: domains/beauty
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Bind execution to exact head
        shell: bash
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git -C ../.. rev-parse HEAD)"
          echo "EXPECTED_HEAD=$EXPECTED"
          echo "ACTUAL_HEAD=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify candidate contracts
        run: npm run ci

      - name: Prove synthetic evidence cannot satisfy real admission
        shell: bash
        run: |
          if npm run proof:verify -- proof/synthetic-example.json; then
            echo "Synthetic evidence incorrectly passed the real-proof verifier."
            exit 1
          fi
          echo "Synthetic evidence rejected as required."
