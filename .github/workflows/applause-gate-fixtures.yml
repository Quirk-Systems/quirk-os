name: Applause Gate Fixture Corpus

on:
  pull_request:
    paths:
      - '.github/workflows/applause-gate-fixtures.yml'
      - 'docs/superpowers/specs/2026-08-21-applause-gate-design.md'
      - 'evals/applause-gate/**'
      - 'scripts/validate_applause_gate_fixtures.py'
      - 'tests/test_applause_gate_fixtures.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applause-gate-fixtures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-fixture-conformance:
    name: candidate-fixture-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Run fixture tests
        run: python -m unittest discover -s tests -p 'test_applause_gate_fixtures.py' -v

      - name: Validate fixture corpus
        run: |
          python scripts/validate_applause_gate_fixtures.py \
            --repo . \
            --output evals/applause-gate/fixture-validation.json \
            --require-pass

      - name: Upload candidate fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: applause-gate-fixture-validation-${{ github.sha }}
          path: evals/applause-gate/fixture-validation.json
          if-no-files-found: error
          retention-days: 30
