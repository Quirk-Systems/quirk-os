name: One-to-Infinity Candidate Conformance

on:
  pull_request:
    paths:
      - '.github/workflows/one-to-infinity-candidate.yml'
      - 'programs/one-to-infinity/**'
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/one-to-infinity-candidate.yml'
      - 'programs/one-to-infinity/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-to-infinity-candidate-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head (not synthetic merge SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Clear generated evidence before validation
        run: |
          rm -f programs/one-to-infinity/evidence/validation-report.generated.json
          rm -f programs/one-to-infinity/evidence/ci-receipt.json
      - name: Test exact-head receipt guards
        run: python -m unittest discover -s programs/one-to-infinity/tests -p 'test_emit_ci_receipt.py' -v
      - name: Validate candidate pack
        run: python programs/one-to-infinity/tests/validate_contracts.py
      - name: Bind source head and evidence digests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python programs/one-to-infinity/tests/emit_ci_receipt.py \
            --repo-root . \
            --expected-head "$EXPECTED_HEAD"
      - name: Upload candidate evidence (not approval)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: one-to-infinity-candidate-evidence
          path: |
            programs/one-to-infinity/evidence/validation-report.generated.json
            programs/one-to-infinity/evidence/ci-receipt.json
          if-no-files-found: warn
          retention-days: 30
