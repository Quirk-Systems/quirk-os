name: One-to-Infinity Candidate Conformance

on:
  pull_request:
    paths:
      - '.github/workflows/one-to-infinity-candidate.yml'
      - 'programs/one-to-infinity/**'
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/one-to-infinity-candidate.yml'
      - 'programs/one-to-infinity/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-to-infinity-candidate-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate candidate pack
        run: python programs/one-to-infinity/tests/validate_contracts.py
      - name: Record exact head
        run: |
          printf '%s\n' "${GITHUB_SHA}" > programs/one-to-infinity/evidence/validated-head.txt
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: one-to-infinity-candidate-evidence
          path: |
            programs/one-to-infinity/evidence/validation-report.generated.json
            programs/one-to-infinity/evidence/validated-head.txt
          if-no-files-found: error
          retention-days: 30
