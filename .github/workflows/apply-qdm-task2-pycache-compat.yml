name: Apply QDM Task 2 Bytecode Compatibility

on:
  pull_request:
    branches:
      - agent/quirk-daily-move-fixture-corpus
    paths:
      - '.github/workflows/apply-qdm-task2-pycache-compat.yml'
      - '.bootstrap/qdm-task2-pycache-compat.patch'
  push:
    branches:
      - agent/quirk-daily-move-io-schemas
    paths:
      - '.github/workflows/apply-qdm-task2-pycache-compat.yml'
      - '.bootstrap/qdm-task2-pycache-compat.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Task 2 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/quirk-daily-move-io-schemas
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-evals.txt

      - name: Install evaluation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-evals.txt

      - name: Verify and apply bounded bytecode patch
        run: |
          echo "56cc5dbee1d3e116787dd0129f398662483788227f9b3306ad55ad5ce4e6766c  .bootstrap/qdm-task2-pycache-compat.patch" | sha256sum --check -
          cp .github/workflows/apply-qdm-task2-pycache-compat.yml /tmp/apply-qdm-task2-pycache-compat.yml
          git apply --check --whitespace=error-all .bootstrap/qdm-task2-pycache-compat.patch
          git apply .bootstrap/qdm-task2-pycache-compat.patch
          rm -f .bootstrap/qdm-task2-pycache-compat.patch
          rm -f .github/workflows/apply-qdm-task2-pycache-compat.yml
          rmdir .bootstrap 2>/dev/null || true

      - name: Verify full cross-suite compatibility
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/validate_daily_move_fixtures.py --require-pass
          python scripts/validate_daily_move_io.py --require-pass --report /tmp/daily-move-io-conformance.json
          python scripts/validate_sync_control_plane.py --repo . --output /tmp/sync-control-plane-conformance.json --require-admit

      - name: Publish ordinary bytecode compatibility commit
        run: |
          mkdir -p .github/workflows
          cp /tmp/apply-qdm-task2-pycache-compat.yml .github/workflows/apply-qdm-task2-pycache-compat.yml
          git config user.name "Quirk Task 2 Builder"
          git config user.email "noreply@quirk.systems"
          git add scripts/validate_daily_move_fixtures.py tests/test_daily_move_task1_compatibility.py
          git add -u .bootstrap/qdm-task2-pycache-compat.patch
          git commit -m "test: ignore only generated contract bytecode"
          git push origin HEAD:agent/quirk-daily-move-io-schemas
