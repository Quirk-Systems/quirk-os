name: Partials Foundation Conformance

on:
  pull_request:
    paths:
      - 'candidates/partials-v0.1.0/**'
      - '.github/workflows/partials-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-partials:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: candidates/partials-v0.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: candidates/partials-v0.1.0/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Structural, semantic, adapter, and CLI conformance
        run: npm run check
      - name: Independent schema and format validation
        run: python scripts/independent_schema.py
      - name: Verify deterministic fixture projections
        run: |
          npm run fixtures
          git diff --exit-code -- fixtures schemas
