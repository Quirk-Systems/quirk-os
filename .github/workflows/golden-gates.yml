name: Golden Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  structural-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Golden Project Pack
        run: python scripts/validate_golden_pack.py
