name: Golden Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: golden-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structural-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install evaluation dependencies
        # Full schema validation includes RFC 3339 formats; use the existing pins.
        # Candidate merge checks remain separate from admission holds.
        # Install rather than silently skipping optional format validation.
        run: python -m pip install --disable-pip-version-check -r requirements-evals.txt

      - name: Run repository tests including Golden admission regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Golden Project Pack
        run: python scripts/validate_golden_pack.py
