name: Agent reliability fixtures

on:
  pull_request:
    paths:
      - "scripts/agent_reliability/**"
      - "scripts/validate_agent_reliability.py"
      - "tests/test_agent_reliability.py"
      - "evals/agent-reliability/**"
      - ".github/workflows/agent-reliability.yml"
  workflow_dispatch:

jobs:
  candidate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_agent_reliability.py -q
      - run: python scripts/validate_agent_reliability.py
