name: Agent reliability fixtures

on:
  pull_request:
    paths:
      - "scripts/agent_reliability/**"
      - "scripts/validate_agent_reliability.py"
      - "tests/test_agent_reliability.py"
      - "evals/agent-reliability/**"
      - ".github/workflows/agent-reliability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_agent_reliability.py -q
      - run: python scripts/validate_agent_reliability.py
      - run: python -m pip install -r requirements-evals.txt
      - run: python -m unittest discover -s tests -q

  # Keep the existing candidate-fixtures check and add an explicit OS probe.
  ubuntu26-fixtures:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head and record Ubuntu image
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cat /etc/os-release
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_agent_reliability.py -q
      - run: python scripts/validate_agent_reliability.py
      - run: python -m pip install -r requirements-evals.txt
      - run: python -m unittest discover -s tests -q
