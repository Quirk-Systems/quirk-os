name: Context continuity fixtures
on:
  pull_request:
    paths:
      - scripts/context_continuity.py
      - scripts/validate_context_profiles.py
      - tests/test_context_continuity.py
      - .quirk/context-profile.json
      - .github/workflows/context-continuity.yml
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p test_context_continuity.py -v
      - run: python3 scripts/validate_context_profiles.py .quirk/context-profile.json
